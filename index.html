<script id="nativeplayer">
(function () {
  window.initPlayers = function (root) {
    var boxes = (root || document).querySelectorAll(".vp");
    for (var i = 0; i < boxes.length; i++) {
      var box = boxes[i], src = box.getAttribute("data-src");
      var v = document.createElement("video");
      v.controls = true;
      v.setAttribute("playsinline", "");
      v.preload = "metadata";
      v.style.cssText = "position:absolute;inset:0;width:100%;height:100%;background:#000";
      if (/\.m3u8(\?|$)/i.test(src) && !v.canPlayType("application/vnd.apple.mpegurl") && window.Hls && Hls.isSupported()) {
        var hl = new Hls(); hl.loadSource(src); hl.attachMedia(v);
      } else { v.src = src; }
      box.innerHTML = "";
      box.appendChild(v);
    }
  };
})();
</script>

<script id="scrollfx">
(function () {
  var app = document.getElementById("app");
  if (!app) return;
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var SEL = ".h, .row, .grid > .pc, .el > .er, .navrow";
  var io = null;
  if (!reduce && "IntersectionObserver" in window) {
    io = new IntersectionObserver(function (entries) {
      var vis = entries.filter(function (e) { return e.isIntersecting; });
      vis.forEach(function (e, i) {
        var el = e.target;
        el.style.transitionDelay = Math.min(i, 6) * 60 + "ms";
        el.classList.add("in");
        io.unobserve(el);
        setTimeout(function () { el.classList.remove("rv", "in"); el.style.transitionDelay = ""; }, 1100);
      });
    }, { root: app, rootMargin: "0px 0px -6% 0px", threshold: 0.05 });
  }
  function mark() {
    if (!io) return;
    var list = app.querySelectorAll(SEL);
    for (var i = 0; i < list.length; i++) {
      var el = list[i];
      if (el.__rv) continue;
      el.__rv = true;
      el.classList.add("rv");
      io.observe(el);
    }
  }
  var raf = 0;
  function par() {
    raf = 0;
    if (reduce) return;
    var img = app.querySelector(".backdrop img, .hero img");
    if (!img) return;
    var t = Math.min(Math.max(0, app.scrollTop) * 0.25, 22);
    img.style.transform = "translate3d(0," + t.toFixed(1) + "px,0) scale(1.14)";
  }
  function queue() { if (!raf) raf = requestAnimationFrame(par); }
  app.addEventListener("scroll", queue, { passive: true });
  new MutationObserver(function () { mark(); queue(); }).observe(app, { childList: true, subtree: true });
  mark();
  queue();
})();
</script>
<script id="pckeys">
(function () {
  if (!window.matchMedia || !matchMedia("(hover: hover)").matches) return;
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    var k = e.key;
    if (k === "/") {
      var b = document.getElementById("sbtn");
      if (!b) return;
      e.preventDefault();
      b.click();
      setTimeout(function () { var i = document.getElementById("ssin"); if (i) { i.readOnly = false; i.focus(); } }, 150);
    } else if (k === "n" || k === "N") {
      var nx = document.getElementById("wnext");
      if (nx && !nx.disabled) nx.click();
    } else if (k === "p" || k === "P") {
      var pv = document.getElementById("wprev");
      if (pv && !pv.disabled) pv.click();
    }
  });
})();
</script>
<script id="imgboost">
(function () {
  var app = document.getElementById("app");
  if (!app) return;
  function boost() {
    var hi = app.querySelectorAll(".hero img, .backdrop img");
    for (var i = 0; i < hi.length; i++) { hi[i].loading = "eager"; hi[i].setAttribute("fetchpriority", "high"); }
    var rows = app.querySelectorAll(".row");
    for (var r = 0; r < rows.length; r++) {
      var im = rows[r].querySelectorAll(".pc img");
      for (var k = 0; k < im.length && k < 4; k++) im[k].loading = "eager";
    }
    var gi = app.querySelectorAll(".grid .pc img");
    for (var g = 0; g < gi.length && g < 6; g++) gi[g].loading = "eager";
  }
  new MutationObserver(boost).observe(app, { childList: true, subtree: true });
  boost();
})();
</script>

<script id="autonext">
(function () {
  document.addEventListener("ended", function (e) {
    if (e.target && e.target.tagName === "VIDEO") window.__ap = true;
  }, true);
  var ip0 = window.initPlayers;
  window.initPlayers = function (root) {
    if (ip0) ip0(root);
    if (!window.__ap) return;
    window.__ap = false;
    var vs = (root || document).querySelectorAll("video");
    for (var i = 0; i < vs.length; i++) {
      vs[i].autoplay = true;
      var p = vs[i].play();
      if (p && p.catch) p.catch(function () {});
    }
  };
  var END = /^(ended|end|finish|finished|complete|completed|video_end|videoend|playbackended|playback_ended|player_ended|onended|ended_event)$/i;
  function isEnd(d, depth) {
    depth = depth || 0;
    if (d == null || depth > 2) return false;
    if (typeof d === "string") {
      var s = d.trim();
      if (END.test(s)) return true;
      if (s.charAt(0) !== "{") return false;
      try { d = JSON.parse(s); } catch (e) { return false; }
    }
    if (typeof d !== "object") return false;
    var ev = d.event || d.type || d.name || d.action || d.method || d.message || "";
    if (typeof ev === "string" && END.test(ev)) return true;
    if (ev === "onStateChange" && (d.info === 0 || (d.info && d.info.playerState === 0))) return true;
    if (d.data && depth < 2) return isEnd(d.data, depth + 1);
    return false;
  }
  window.addEventListener("message", function (e) {
    var f = document.querySelector(".player iframe");
    if (!f || !isEnd(e.data)) return;
    var ok = e.source === f.contentWindow;
    if (!ok) { try { ok = e.origin === new URL(f.src).origin; } catch (x) {} }
    if (ok) upNext();
  });
  function upNext() {
    var nx = document.getElementById("wnext"), box = document.querySelector(".player");
    if (!nx || nx.disabled || !box || box.querySelector(".upnext")) return;
    var n = 5;
    var el = document.createElement("div");
    el.className = "upnext";
    el.innerHTML = '<div class="un"><div class="ut">Next episode in <b>5</b></div><div class="ub"><button class="navb glass" data-a="now">Play now</button><button class="navb glass" data-a="cancel">Cancel</button></div></div>';
    box.appendChild(el);
    var t = setInterval(function () {
      if (!el.isConnected) { clearInterval(t); return; }
      n--;
      if (n <= 0) { clearInterval(t); el.remove(); nx.click(); }
      else el.querySelector("b").textContent = n;
    }, 1000);
    el.addEventListener("click", function (ev) {
      var b = ev.target.closest ? ev.target.closest("button") : null;
      if (!b) return;
      clearInterval(t);
      el.remove();
      if (b.getAttribute("data-a") === "now") nx.click();
    });
  }
})();
</script>
<script id="msgdebug">
(function () {
  if (location.search.indexOf("debug") === -1) return;
  var box = document.createElement("div");
  box.style.cssText = "position:fixed;left:8px;right:8px;top:8px;z-index:99999;background:rgba(0,0,0,.9);color:#9f9;font:11px/1.35 monospace;padding:8px;border-radius:10px;max-height:38vh;overflow:auto;white-space:pre-wrap;word-break:break-all;border:1px solid #444";
  document.body.appendChild(box);
  var n = 0, log = "";
  function show(extra) {
    var f = document.querySelector(".player iframe");
    var head = "autonext installed: " + (document.getElementById("autonext") ? "yes" : "NO") +
      "\nplayer: " + (f ? "iframe " + f.src.split("/").slice(0, 3).join("/") : (document.querySelector(".player video") ? "direct video" : "none")) +
      "\nmessages received: " + n + "\n";
    box.textContent = head + (extra ? "\n" + extra : "") + "\n" + log.slice(0, 1400);
  }
  window.addEventListener("message", function (e) {
    var d;
    try { d = typeof e.data === "string" ? e.data : JSON.stringify(e.data); } catch (x) { d = String(e.data); }
    n++;
    log = "[" + n + "] " + e.origin + " -> " + String(d).slice(0, 160) + "\n" + log;
    show();
  });
  document.addEventListener("ended", function (e) {
    if (e.target && e.target.tagName === "VIDEO") { log = "VIDEO ENDED EVENT\n" + log; show(); }
  }, true);
  setInterval(function () { show(); }, 1500);
  show();
})();
</script>
