<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>AniFlix</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<link rel="stylesheet" href="style.css?v=5">
<link rel="stylesheet" href="player.css?v=5">
<script>
window.onerror = function (m, u, l) {
  var d = document.getElementById("app");
  if (d) d.innerHTML = '<pre style="white-space:pre-wrap;padding:16px;color:#ff8a8a">Error: ' + m + ' (line ' + l + ')</pre>';
};
</script>
<style id="redtheme">
:root{--red:#e50914;--redl:#ff4d57}
body,.bg{background:#050505!important}
.bg i:nth-child(1){background:#e50914!important}
.bg i:nth-child(2){background:#7a0010!important}
.bg i:nth-child(3){background:#ff2d55!important;opacity:.35!important}
.logo{background:linear-gradient(90deg,#ff6b73,#e50914)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
.hero,.pc,.backdrop{background:linear-gradient(160deg,#5a0010,#1a0004)!important}
.shade{background:linear-gradient(180deg,rgba(0,0,0,.1) 30%,rgba(0,0,0,.92))!important}
.backdrop .shade{background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.15) 40%,rgba(5,5,5,.97))!important}
.btn.primary{background:linear-gradient(135deg,rgba(255,70,80,.96),rgba(190,10,30,.96))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 28px rgba(229,9,20,.5)!important}
.tabbar a.on{background:rgba(229,9,20,.4)!important}
.er.active{border-color:rgba(255,90,100,.8)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 1px rgba(255,90,100,.4),0 10px 30px rgba(229,9,20,.35)!important}
.er.active .num{background:linear-gradient(135deg,rgba(255,70,80,.96),rgba(190,10,30,.96))!important}
.er.active .s,.more,.navrow .mid a{color:#ff4d57!important}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div id="app" class="wrap"><div class="empty">Loading AniFlix...</div></div>
<nav class="tabbar glass" id="tabs">
  <a href="#" data-tab="home"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#search" data-tab="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Search</a>
  <a href="#list" data-tab="list"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>My List</a>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</body>
</html>
