<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AniFlix</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: sans-serif; color: #fff; min-height: 100vh;
    background: radial-gradient(circle at top, #1b1f3b, #0a0a12 70%);
  }
  header { padding: 16px; text-align: center; font-size: 22px; font-weight: bold; }
  main { padding: 12px; max-width: 900px; margin: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .glass {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
  }
  .card { overflow: hidden; cursor: pointer; }
  .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #222; }
  .card p { margin: 8px; font-size: 14px; }
  button {
    color: #fff; padding: 10px 14px; margin: 4px 4px 4px 0; cursor: pointer;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px; font-size: 14px;
  }
  .player { position: relative; padding-top: 56.25%; margin: 12px 0; border-radius: 16px; overflow: hidden; }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .box { padding: 14px; margin-bottom: 12px; }
</style>
</head>
<body>
<header>AniFlix</header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
