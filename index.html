<style id="redtheme">
body,.bg{background:#000!important}
.bg i{background:#fff!important;opacity:.05!important}
.logo{background:none!important;color:#fff!important;-webkit-text-fill-color:#fff!important}
.hero,.pc,.backdrop{background:linear-gradient(160deg,#1c1c1e,#0a0a0a)!important}
.shade{background:linear-gradient(180deg,rgba(0,0,0,.1) 30%,rgba(0,0,0,.92))!important}
.backdrop .shade{background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.1) 40%,#000)!important}
.info{position:relative!important;z-index:2!important;margin-top:-72px!important}
.info h1{margin:0 0 10px!important}
.btn.primary{background:linear-gradient(135deg,#ff3b47,#c1121f)!important;border-color:rgba(255,255,255,.3)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 28px rgba(229,9,20,.45)!important}
.tabbar a.on{background:rgba(229,9,20,.85)!important;color:#fff!important}
.er.active{border-color:rgba(255,255,255,.5)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 30px rgba(0,0,0,.6)!important}
.er.active .num{background:linear-gradient(135deg,#ff3b47,#c1121f)!important}
.er.active .s,.more,.navrow .mid a{color:#fff!important}
</style>
<style id="smooth">
.tabbar{--i:0}
.pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 20px) / 3);border-radius:999px;background:linear-gradient(135deg,#ff3b47,#c1121f);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px rgba(229,9,20,.45);transform:translateX(calc(var(--i) * (100% + 4px)));transition:transform .5s cubic-bezier(.34,1.35,.5,1)}
.tabbar a{position:relative;z-index:1;transition:color .25s,transform .2s}
.tabbar a.on{background:transparent!important;box-shadow:none!important;color:#fff!important}
.tabbar a:active{transform:scale(.92)}
.tabbar a svg{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.tabbar a.on svg{transform:translateY(-1px) scale(1.12)}
#app.enter-r{animation:inR .4s cubic-bezier(.22,.9,.3,1) both}
#app.enter-l{animation:inL .4s cubic-bezier(.22,.9,.3,1) both}
#app.enter-u{animation:inU .4s cubic-bezier(.22,.9,.3,1) both}
@keyframes inR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes inU{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
#app>*{animation:fadeUp .45s cubic-bezier(.22,.9,.3,1) both}
#app>*:nth-child(2){animation-delay:.04s}
#app>*:nth-child(3){animation-delay:.08s}
#app>*:nth-child(4){animation-delay:.12s}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
<style id="watchcss">
.wbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.wback{flex:0 0 44px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:26px;line-height:1;padding-bottom:3px;color:#fff}
.wtitle{display:flex;flex-direction:column;min-width:0}
.wtitle .a{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtitle .b{font-size:13px;color:rgba(255,255,255,.6)}
.wbar+.player{margin-top:0}
.wnav{margin-top:14px}
.tabbar{transition:transform .45s cubic-bezier(.22,.9,.3,1),opacity .3s}
body.watching .tabbar{transform:translate(-50%,160%);opacity:0;pointer-events:none}
</style>

<style id="perf">
.bg i{display:none!important;animation:none!important}
.bg{background:#000 radial-gradient(70% 35% at 50% 0%,rgba(255,255,255,.06),transparent 70%)!important}
.glass{backdrop-filter:blur(12px)!important;-webkit-backdrop-filter:blur(12px)!important}
.pc .pt,.pc .rate{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(0,0,0,.55)!important}
.er,.navb,.sort{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(255,255,255,.08)!important}
.er.active{background:rgba(255,255,255,.12)!important}
.chip{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#app>*:not(.skel){animation:none!important}
.pill{will-change:transform}
.ssb{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(0,0,0,.78)!important}
.ssp{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:linear-gradient(160deg,#1d1d20,#0d0d0f)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 20px 60px rgba(0,0,0,.7)!important;border-radius:34px!important;transition:transform .42s cubic-bezier(.22,.9,.3,1),opacity .25s!important;will-change:transform,opacity}
.ss.show .ssp{border-radius:34px!important}
</style>
<style id="tsbar">
.topbar{position:relative!important;height:44px}
.topbar .logo{transition:opacity .25s,transform .4s cubic-bezier(.22,.9,.3,1)}
.topbar.open .logo{opacity:0;transform:translateX(-14px);pointer-events:none}
.tsw{position:absolute;right:0;top:0;height:44px;width:44px;border-radius:999px;display:flex;align-items:center;overflow:hidden;border:1px solid rgba(255,255,255,.2);background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 24px rgba(0,0,0,.45);transition:width .4s cubic-bezier(.22,.9,.3,1);will-change:width;contain:layout paint}
.topbar.open .tsw{width:100%}
.tsb,.tsx{flex:0 0 42px;width:42px;height:42px;background:none;border:0;padding:0;display:grid;place-items:center;color:#fff;cursor:pointer}
.tsx{font-size:15px;opacity:0;transition:opacity .2s .15s}
.topbar.open .tsx{opacity:1}
.tsw input{flex:1;min-width:0;height:42px;background:none;border:0;outline:0;color:#fff;font-size:16px;opacity:0;pointer-events:none;transition:opacity .2s .12s}
.topbar.open .tsw input{opacity:1;pointer-events:auto}
.tsw input::placeholder{color:rgba(255,255,255,.55)}
.tsd{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:40;background:rgba(0,0,0,.72);opacity:0;pointer-events:none;transition:opacity .3s}
.tsd.show{opacity:1;pointer-events:auto}
.tsres{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);width:min(calc(100% - 32px),688px);max-height:60vh;overflow:hidden;display:flex;flex-direction:column;z-index:41;border-radius:26px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(160deg,#1d1d20,#0d0d0f);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 20px 50px rgba(0,0,0,.7);opacity:0;pointer-events:none;transform:translate(-50%,-10px);transition:opacity .25s,transform .35s cubic-bezier(.22,.9,.3,1)}
.tsres.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.tsres .ssr{flex:1;overflow-y:auto;padding:8px 12px 14px;-webkit-overflow-scrolling:touch}
.ssl{font-size:13px;font-weight:700;color:rgba(255,255,255,.55);margin:6px 8px 8px;letter-spacing:.4px;text-transform:uppercase}
.rr{display:flex;align-items:center;gap:12px;padding:8px;border-radius:18px;transition:background .2s}
.rr:active{background:rgba(255,255,255,.1)}
.rr .th{flex:0 0 46px;height:66px;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#1c1c1e,#0a0a0a)}
.rr .th img{width:100%;height:100%;object-fit:cover;display:block}
.rr .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rr .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .s{font-size:12px;color:rgba(255,255,255,.6)}
.rr .go{color:rgba(255,255,255,.5);font-size:24px}
</style>
<style id="fixlabel">
.pc .pt{display:block!important;overflow:hidden!important;-webkit-line-clamp:unset!important}
.pc .pt span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25;word-break:break-word}

<style id="shell">
html,body{height:100%;min-height:0!important;overflow:hidden!important}
#app{position:fixed!important;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
</style>
<style id="fulltitle">

<script id="rotate">
(function () {
  function onFs() {
    var fs = document.fullscreenElement || document.webkitFullscreenElement;
    var o = window.screen && screen.orientation;
    if (!o) return;
    try {
      if (fs) { if (o.lock) { var p = o.lock("landscape"); if (p && p.catch) p.catch(function () {}); } }
      else if (o.unlock) o.unlock();
    } catch (e) {}
  }
  document.addEventListener("fullscreenchange", onFs);
  document.addEventListener("webkitfullscreenchange", onFs);
})();
</script>
<style id="ratio">

<style id="backbtn">
.rb.l,.wback{display:flex!important;align-items:center!important;justify-content:center!important;font-size:0!important;line-height:0!important;padding:0!important}
.rb.l>span,.wback>span{display:none}
.rb.l::before,.wback::before{content:"";display:block;flex:none;width:11px;height:11px;border-left:3px solid #fff;border-bottom:3px solid #fff;border-radius:2px;transform:translateX(3.5px) rotate(45deg)}
</style>
<style id="scrollfx-css">
.rv{opacity:0;transform:translate3d(0,24px,0) scale(.98);transition:opacity .55s cubic-bezier(.22,.9,.3,1),transform .6s cubic-bezier(.22,.9,.3,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}
</style>
<style id="epswap">
@keyframes swapF{from{opacity:0;transform:translate3d(46px,0,0) scale(.97)}to{opacity:1;transform:none}}
@keyframes swapB{from{opacity:0;transform:translate3d(-46px,0,0) scale(.97)}to{opacity:1;transform:none}}
@keyframes rowPop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.swap-f{animation:swapF .5s cubic-bezier(.22,.9,.3,1) both}
.swap-b{animation:swapB .5s cubic-bezier(.22,.9,.3,1) both}
.swap-d1{animation-delay:.05s}
.swap-d2{animation-delay:.1s}
#app.epswitch{animation:none!important}
.er.active{animation:rowPop .45s cubic-bezier(.22,.9,.3,1)}
@media (prefers-reduced-motion:reduce){.swap-f,.swap-b,.er.active{animation:none}}
</style>
<style id="listfix">
.el{overflow-x:hidden!important;padding:8px 2px 16px!important;scrollbar-width:none;-ms-overflow-style:none}
.el::-webkit-scrollbar{display:none;width:0;height:0}
.el > .er.rv{transform:none!important}
@keyframes rowPop{0%{opacity:.55}100%{opacity:1}}
.er.active{animation:rowPop .35s ease-out!important}
</style>
</head>

<script id="nativeplayer">
(function () {
  window.initPlayers = function (root) {
    var boxes = (root || document).querySelectorAll(".vp");
    for (var i = 0; i < boxes.length; i++) {
      var box = boxes[i], src = box.getAttribute("data-src");
      var v = document.createElement("video");
      v.controls = true;
      v.setAttribute("playsinline", "");
      v.preload = "metadata";
      v.style.cssText = "position:absolute;inset:0;width:100%;height:100%;background:#000";
      if (/\.m3u8(\?|$)/i.test(src) && !v.canPlayType("application/vnd.apple.mpegurl") && window.Hls && Hls.isSupported()) {
        var hl = new Hls(); hl.loadSource(src); hl.attachMedia(v);
      } else { v.src = src; }
      box.innerHTML = "";
      box.appendChild(v);
    }
  };
})();
</script>
<script src="app.js?v=32"></script>
<script id="scrollfx">
(function () {
  var app = document.getElementById("app");
  if (!app) return;
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var SEL = ".h, .row, .grid > .pc, .el > .er, .navrow";
  var io = null;
  if (!reduce && "IntersectionObserver" in window) {
    io = new IntersectionObserver(function (entries) {
      var vis = entries.filter(function (e) { return e.isIntersecting; });
      vis.forEach(function (e, i) {
        var el = e.target;
        el.style.transitionDelay = Math.min(i, 6) * 60 + "ms";
        el.classList.add("in");
        io.unobserve(el);
        setTimeout(function () { el.classList.remove("rv", "in"); el.style.transitionDelay = ""; }, 1100);
      });
    }, { root: app, rootMargin: "0px 0px -6% 0px", threshold: 0.05 });
  }
  function mark() {
    if (!io) return;
    var list = app.querySelectorAll(SEL);
    for (var i = 0; i < list.length; i++) {
      var el = list[i];
      if (el.__rv) continue;
      el.__rv = true;
      el.classList.add("rv");
      io.observe(el);
    }
  }
  var raf = 0;
  function par() {
    raf = 0;
    if (reduce) return;
    var img = app.querySelector(".backdrop img, .hero img");
    if (!img) return;
    var t = Math.min(Math.max(0, app.scrollTop) * 0.25, 22);
    img.style.transform = "translate3d(0," + t.toFixed(1) + "px,0) scale(1.14)";
  }
  function queue() { if (!raf) raf = requestAnimationFrame(par); }
  app.addEventListener("scroll", queue, { passive: true });
  new MutationObserver(function () { mark(); queue(); }).observe(app, { childList: true, subtree: true });
  mark();
  queue();
})();
</script>
