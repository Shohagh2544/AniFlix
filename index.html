<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070f">
<title>AniFlix</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<style>
  :root {
    --bg: #07070f; --text: #f4f4f8; --muted: #a3a3b8;
    --accent: #8b5cf6; --accent2: #ec4899;
    --glass: rgba(255,255,255,0.07); --line: rgba(255,255,255,0.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; color: var(--text); min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(60% 40% at 15% 0%, rgba(139,92,246,0.28), transparent 70%),
      radial-gradient(50% 40% at 100% 10%, rgba(236,72,153,0.18), transparent 70%),
      var(--bg);
    background-attachment: fixed;
  }
  a { color: inherit; text-decoration: none; }

  header.top {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px));
    background: rgba(7,7,15,0.65);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--line);
  }
  .logo {
    font-size: 22px; font-weight: 800; letter-spacing: -0.5px; white-space: nowrap;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .search { flex: 1; min-width: 0; }
  .search input {
    width: 100%; padding: 10px 16px; font-size: 15px; color: var(--text);
    background: var(--glass); border: 1px solid var(--line); border-radius: 999px; outline: none;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { border-color: var(--accent); }

  main { max-width: 1000px; margin: 0 auto; padding: 16px; padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }
  .section { font-size: 18px; margin: 8px 0 14px; font-weight: 700; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
  .card {
    position: relative; display: block; aspect-ratio: 2/3; overflow: hidden;
    border-radius: 18px; border: 1px solid var(--line);
    background: linear-gradient(160deg, #2a1f5c, #4a1d4f);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card .info {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 36px 12px 12px;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    font-size: 14px; font-weight: 600; line-height: 1.25;
  }
  .card:active { transform: scale(0.97); }
  @media (hover: hover) { .card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(139,92,246,0.35); } }

  .skeleton {
    background: linear-gradient(100deg, rgba(255,255,255,0.05) 30%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 70%);
    background-size: 200% 100%; animation: shimmer 1.3s infinite linear;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .back {
    display: inline-block; margin-bottom: 14px; padding: 8px 14px; font-size: 14px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 999px;
  }
  .hero {
    display: flex; gap: 16px; padding: 14px; margin-bottom: 16px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 20px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .hero .poster {
    flex: 0 0 96px; aspect-ratio: 2/3; border-radius: 14px; overflow: hidden;
    background: linear-gradient(160deg, #2a1f5c, #4a1d4f);
  }
  .hero .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero h2 { margin: 2px 0 6px; font-size: 22px; line-height: 1.2; }
  .hero p { margin: 0 0 10px; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .badge {
    display: inline-block; padding: 4px 10px; font-size: 12px; font-weight: 600;
    border-radius: 999px; background: rgba(139,92,246,0.25); border: 1px solid rgba(139,92,246,0.5);
  }

  .player {
    position: relative; width: 100%; aspect-ratio: 16/9; background: #000;
    border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
  }
  .player iframe, .player video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  @media (max-width: 600px) { .player { aspect-ratio: 4/3; } }
  .now { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 10px 2px 18px; font-size: 14px; }
  .now span { color: var(--muted); }
  .fs { white-space: nowrap; font-size: 13px; padding: 6px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); }

  .eps { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-width: 64px; padding: 10px 14px; font-size: 14px; font-weight: 600; color: var(--text);
    background: var(--glass); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
    transition: transform .15s ease, background .2s ease;
  }
  .chip:active { transform: scale(0.95); }
  .chip.active { background: linear-gradient(90deg, var(--accent), var(--accent2)); border-color: transparent; }

  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#">AniFlix</a>
  <div class="search"><input id="search" type="search" placeholder="Search anime..." autocomplete="off"></div>
</header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
