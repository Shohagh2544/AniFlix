<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>AniFlix</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">

<script>
window.onerror = function (m, u, l) {
  var d = document.getElementById("app");
  if (d) d.innerHTML = '<pre style="white-space:pre-wrap;padding:16px;color:#ff8a8a">Error: ' + m + ' (line ' + l + ')</pre>';
};
</script>
<style id="redtheme">
body,.bg{background:#000!important}
.bg i{background:#fff!important;opacity:.05!important}
.logo{background:none!important;color:#fff!important;-webkit-text-fill-color:#fff!important}
.hero,.pc,.backdrop{background:linear-gradient(160deg,#1c1c1e,#0a0a0a)!important}
.shade{background:linear-gradient(180deg,rgba(0,0,0,.1) 30%,rgba(0,0,0,.92))!important}
.backdrop .shade{background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.1) 40%,#000)!important}
.info{position:relative!important;z-index:2!important;margin-top:-72px!important}
.info h1{margin:0 0 10px!important}
.btn.primary{background:linear-gradient(135deg,#ff3b47,#c1121f)!important;border-color:rgba(255,255,255,.3)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 28px rgba(229,9,20,.45)!important}
.tabbar a.on{background:rgba(229,9,20,.85)!important;color:#fff!important}
.er.active{border-color:rgba(255,255,255,.5)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 30px rgba(0,0,0,.6)!important}
.er.active .num{background:linear-gradient(135deg,#ff3b47,#c1121f)!important}
.er.active .s,.more,.navrow .mid a{color:#fff!important}
</style>
<style id="smooth">
.tabbar{--i:0}
.pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 20px) / 3);border-radius:999px;background:linear-gradient(135deg,#ff3b47,#c1121f);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px rgba(229,9,20,.45);transform:translateX(calc(var(--i) * (100% + 4px)));transition:transform .5s cubic-bezier(.34,1.35,.5,1)}
.tabbar a{position:relative;z-index:1;transition:color .25s,transform .2s}
.tabbar a.on{background:transparent!important;box-shadow:none!important;color:#fff!important}
.tabbar a:active{transform:scale(.92)}
.tabbar a svg{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.tabbar a.on svg{transform:translateY(-1px) scale(1.12)}
#app.enter-r{animation:inR .4s cubic-bezier(.22,.9,.3,1) both}
#app.enter-l{animation:inL .4s cubic-bezier(.22,.9,.3,1) both}
#app.enter-u{animation:inU .4s cubic-bezier(.22,.9,.3,1) both}
@keyframes inR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes inU{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
#app>*{animation:fadeUp .45s cubic-bezier(.22,.9,.3,1) both}
#app>*:nth-child(2){animation-delay:.04s}
#app>*:nth-child(3){animation-delay:.08s}
#app>*:nth-child(4){animation-delay:.12s}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
<style id="ssheet">
button.avatar{padding:0;cursor:pointer;color:#fff}
.ss{position:fixed;inset:0;z-index:50;visibility:hidden;pointer-events:none}
.ss.show{visibility:visible;pointer-events:auto}
.ssb{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .35s}
.ss.show .ssb{opacity:1}
.ssp{position:absolute!important;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:696px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:scale(.06);border-radius:999px;transition:transform .55s cubic-bezier(.22,.9,.3,1),opacity .3s,border-radius .55s cubic-bezier(.22,.9,.3,1)}
.ss.show .ssp{opacity:1;transform:scale(1);border-radius:34px}
.ssh,.ssr{opacity:0;transition:opacity .3s .22s}
.ss.show .ssh,.ss.show .ssr{opacity:1}
.ssh{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.ssi{flex:1;display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff}
.ssi input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:16px}
.ssi input::placeholder{color:rgba(255,255,255,.55)}
.ssc{background:none;border:0;color:#fff;font-weight:600;font-size:15px;padding:8px 4px;cursor:pointer}
.ssr{flex:1;overflow-y:auto;padding:4px 12px 16px;-webkit-overflow-scrolling:touch}
.ssl{font-size:13px;font-weight:700;color:rgba(255,255,255,.55);margin:6px 8px 8px;letter-spacing:.4px;text-transform:uppercase}
.rr{display:flex;align-items:center;gap:12px;padding:8px;border-radius:18px;transition:background .2s}
.rr:active{background:rgba(255,255,255,.1)}
.rr .th{flex:0 0 46px;height:66px;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#1c1c1e,#0a0a0a)}
.rr .th img{width:100%;height:100%;object-fit:cover;display:block}
.rr .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rr .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .s{font-size:12px;color:rgba(255,255,255,.6)}
.rr .go{color:rgba(255,255,255,.5);font-size:24px}
</style>
</head>
